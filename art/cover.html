<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:3000px;height:3000px;background:#15110e;overflow:hidden}
.c{position:relative;width:3000px;height:3000px;
  background:radial-gradient(1800px 1400px at 20% 15%,#2a211a 0%,#15110e 70%)}
.grain{position:absolute;inset:0;opacity:.10;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 7px)}
.title{position:absolute;left:230px;top:330px;font-family:"Inter Display";font-weight:900;
  color:#f3e9d8;font-size:620px;line-height:.86;letter-spacing:-22px}
.title .of{font-family:"Bitstream Charter";font-style:italic;font-weight:400;font-size:330px;
  letter-spacing:0;color:#e8643a;display:block;margin:40px 0 30px 12px;line-height:1}
.edge{position:absolute;left:230px;right:0;top:2260px;height:30px;background:#e8643a;
  clip-path:polygon(0 0,82% 0,84% 100%,0 100%)}
.chip{position:absolute;left:2530px;top:2300px;width:170px;height:30px;background:#e8643a;
  transform:rotate(24deg);transform-origin:left top}
.sup{position:absolute;left:1890px;top:300px;font-family:"Bitstream Charter";color:#e8643a;font-size:300px}
.hosts{position:absolute;left:236px;top:2420px;font-family:"Inter";font-weight:600;color:#cdbfa8;
  font-size:118px;letter-spacing:6px;text-transform:uppercase}
.tag{position:absolute;left:236px;top:2600px;font-family:"Bitstream Charter";font-style:italic;color:#8f826f;font-size:104px}
</style></head><body><div class="c"><div class="grain"></div>
<div class="title">EDGE<span class="of">of</span>HISTORY</div><div class="sup">*</div>
<div class="edge"></div><div class="chip"></div>
<div class="hosts">Nora Vance &amp; Cal Whitlock</div>
<div class="tag">The famous story is never the whole story.</div>
</div></body></html>
